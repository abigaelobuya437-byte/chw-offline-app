<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0f766e">
    <title>CHW Records — Health Worker Portal</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="header-inner">
            <div class="brand-group">
                <div class="brand-icon" aria-hidden="true">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M12 2v20M2 12h20"/>
                    </svg>
                </div>
                <div class="brand-text">
                    <h1>CHW Records</h1>
                    <p>Community Health Worker Portal</p>
                </div>
            </div>
            <div id="network-status" class="status-badge" role="status">
                <span class="status-dot"></span>
                <span class="status-text">Checking connection...</span>
            </div>
        </div>
    </header>

    <main>
        <!-- Form Panel -->
        <section class="panel">
            <div class="panel-title-group">
                <div class="panel-icon-circle">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/>
                        <circle cx="9" cy="7" r="4"/>
                        <line x1="19" y1="8" x2="19" y2="14"/>
                        <line x1="22" y1="11" x2="16" y2="11"/>
                    </svg>
                </div>
                <div>
                    <h2>Record a Patient Visit</h2>
                    <p class="panel-subtitle">Enter clinical details collected during patient encounter</p>
                </div>
            </div>

            <form id="patient-form">
                <div class="form-grid">
                    <div class="form-group">
                        <label for="chw_id">CHW ID <span class="required-mark">*</span></label>
                        <input id="chw_id" name="chw_id" placeholder="e.g. CHW-104" required>
                    </div>

                    <div class="form-group">
                        <label for="village_name">Village <span class="required-mark">*</span></label>
                        <input id="village_name" name="village_name" placeholder="e.g. Riverside" required>
                    </div>
                </div>

                <div class="form-group">
                    <label for="patient_name">Patient Name <span class="required-mark">*</span></label>
                    <input id="patient_name" name="patient_name" minlength="2" placeholder="Full name of patient" required>
                </div>

                <div class="form-grid">
                    <div class="form-group">
                        <label for="visit_type">Visit Type <span class="required-mark">*</span></label>
                        <select id="visit_type" name="visit_type" required>
                            <option value="">Select visit type</option>
                            <option value="Maternal">Maternal</option>
                            <option value="Child">Child</option>
                            <option value="General">General</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="urgency_level">Urgency Level <span class="required-mark">*</span></label>
                        <select id="urgency_level" name="urgency_level" required>
                            <option value="Routine">Routine</option>
                            <option value="Urgent">Urgent</option>
                            <option value="Emergency">Emergency</option>
                        </select>
                    </div>
                </div>

                <div class="form-grid">
                    <div class="form-group">
                        <label for="vitals_bp">Blood Pressure <span class="label-hint">(SYS/DIA)</span></label>
                        <input id="vitals_bp" name="vitals_bp" pattern="[0-9]{2,3}/[0-9]{2,3}" placeholder="120/80">
                    </div>

                    <div class="form-group">
                        <label for="vitals_temp">Temperature <span class="label-hint">(°C)</span></label>
                        <input id="vitals_temp" name="vitals_temp" type="number" min="35" max="43" step="0.1" placeholder="36.8">
                    </div>
                </div>

                <div class="form-group">
                    <label for="visit_notes">Visit Notes</label>
                    <textarea id="visit_notes" name="visit_notes" rows="3" placeholder="Symptoms, observed conditions, advice, or medication provided..."></textarea>
                </div>

                <button type="submit" class="btn btn-primary" id="save-button">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/>
                        <polyline points="17 21 17 13 7 13 7 21"/>
                        <polyline points="7 3 7 8 15 8"/>
                    </svg>
                    Save Patient Record
                </button>
            </form>

            <div id="message" role="status" class="alert-container"></div>
        </section>

        <!-- Queue Panel -->
        <section class="panel queue-panel">
            <div class="queue-header">
                <div class="panel-title-group">
                    <div class="panel-icon-circle queue-icon-circle">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <rect x="2" y="3" width="20" height="14" rx="2" ry="2"/>
                            <line x1="8" y1="21" x2="16" y2="21"/>
                            <line x1="12" y1="17" x2="12" y2="21"/>
                        </svg>
                    </div>
                    <div>
                        <h2>Synchronization Queue</h2>
                        <p class="panel-subtitle">Offline records safely cached on this device</p>
                    </div>
                </div>
                <div class="pending-pill">
                    <span class="pill-dot"></span>
                    <span class="pill-label">Pending:</span>
                    <strong id="pending-count">0</strong>
                </div>
            </div>

            <div id="records-list" class="records-list">
                No records displayed yet.
            </div>

            <button id="sync-button" type="button" class="btn btn-secondary">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21.5 2v6h-6M2.5 22v-6h6M2 11.5a10 10 0 0 1 18.8-4.3M22 12.5a10 10 0 0 1-18.8 4.2"/>
                </svg>
                Sync Queue
            </button>
        </section>
    </main>

    <script src="db.js"></script>
    <script src="app.js"></script>
</body>
</html>
